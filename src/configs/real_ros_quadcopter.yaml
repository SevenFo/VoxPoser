env_name: real_ros_quadcopter

log_dir: ./logs/real_ros_quadcopter

env:
  ros_params: !include ../envs/ros_env/params_local_old_camera.yaml # ROS 相关参数 #!include ../envs/ros_env/params_local.yaml
  workspace_bounds_min: [-2, 0, 0] # [x_min, y_min, z_min] unit: meter
  workspace_bounds_max: [2, 6, 2.0] # [x_max, y_max, z_max] unit: meter
  scene_target_objects: ["extinguisher", "toy tank", "wooden house", "tree"] # 环境中可能存在的物体名称
  description: "fly to the point 80cm above extinguisher, than fly to the initial point" # 任务指令 "fly to the wooden house and keep at least 100cm away from the tree"

vlm:
  input_shape: [3, 480, 640] # 图像大小 #[3, 480, 848] # old camera input_shape: [3, 480, 640]  [3, 720, 1280]
  batch_size: 1 # 几个摄像头

planner:
  stop_threshold: 0.001
  savgol_polyorder: 3
  savgol_window_size: 20
  obstacle_map_weight: 1
  max_steps: 300
  obstacle_map_gaussian_sigma: 10
  target_map_weight: 2
  stop_criteria: no_nearby_equal
  target_spacing: 1
  max_curvature: 3
  pushing_skip_per_k: 5
  pick_per_k: 5 # 对生成的路径进行稀疏化，每隔多少个点保留一个路径点

controller:
  type: SimpleROSController
  horizon_length: 1
  num_samples: 10000
  ee_local: temperature
  e4_local_radius: 0.15
  mode: traj # pose, velocity, traj

visualizer:
  quality: low
  map_size: 100

lmp_config: # LMP 相关配置项，包括LLM调用参数、Prompt文件名等
  env:
    map_size: 100
    num_waypoints_per_plan: 10000  # set to a large number since we only do open loop for sim
    max_plan_iter: 1
    visualize: True
    detect_memory: True # 是否保留最后一次观测的信息
    execute_dynamic: True # 是否边规划边执行
  lmps:
    planner:
      prompt_fname: real_planner_prompt
      model: Dummy
      max_tokens: 512
      temperature: 0.3
      query_prefix: '# Query: '
      query_suffix: '.'
      stop: # stop tokens
        - '# Query: '
        - 'objects = '
        - '# done'
      maintain_session: False
      include_context: True
      has_return: False
      return_val_name: ret_val
      load_cache: True
    composer:
      prompt_fname: real_composer_prompt
      model: Dummy
      max_tokens: 512
      temperature: 0.3
      query_prefix: '# Query: '
      query_suffix: '.'
      stop:
        - '# Query: '
        - 'objects ='
        - '# done'
      maintain_session: False
      include_context: False
      has_return: False
      return_val_name: ret_val
