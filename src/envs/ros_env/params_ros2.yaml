cameras:
  - 
    name: "wrist_camera"
    camera_base_link_frame_id: "camera_drone_front_base_link"
    rgb_topic_name: "/wrist_rgb" # 必须
    depth_topic_name: "/wrist_depth"
    cloudpoint_topic_name: "/wrist_depth"  # 必须
    rgb_camera_info_topic_name: "/wrist_camera_info" # 必须
    depth_camera_info_topic_name: "/wrist_camera_info"
    rgb_frame_id: "wrist_camera"
    depth_frame_id: "wrist_camera"
    cloudpoint_frame_id: "wrist_camera"
  - 
    name: "front_camera"
    camera_base_link_frame_id: "camera_assistant_1_base_link"
    rgb_topic_name: "/front_rgb" # 必须
    depth_topic_name: "/front_depth"
    cloudpoint_topic_name: "/front_depth"  # 必须
    rgb_camera_info_topic_name: "/front_camera_info" # 必须
    depth_camera_info_topic_name: "/front_camera_info"
    rgb_frame_id: "front_camera"
    depth_frame_id: "front_camera"
    cloudpoint_frame_id: "front_camera"
world_frame_id: "world" # right +x, front +y, up +z 必须
drone_origin_frame_id: "Franka"
# 坐标系统 todo
frames_tree:
  Franka:
      drone_base_link:
        - camera_drone_front_base_link:
          - camera_drone_front_rgb_frame
          - camera_drone_front_depth_frame
          - camera_drone_front_cloudpoint_frame
        - camera_assistant_1_base_link:
          - camera_assistant_1_rgb_frame
          - camera_assistant_1_depth_frame
          - camera_assistant_1_cloudpoint_frame
        - camera_assistant_2_base_link:
          - camera_assistant_2_rgb_frame
          - camera_assistant_2_depth_frame
          - camera_assistant_2_cloudpoint_frame
        - camera_assistant_3_base_link:
          - camera_assistant_3_rgb_frame
          - camera_assistant_3_depth_frame
          - camera_assistant_3_cloudpoint_frame
action_client_name: "/action_client" # 必须
action_type: MoveBaseAction
action_goal_typedef:
  target_pose:
    header:
      seq: 0
      stamp:
        secs: 0
        nsecs: 0
      frame_id: "world_enu" # 注意检查坐标系
    pose:
      position: # 只用到position
        x: 0.0
        y: 0.0
        z: 0.0
      orientation:
        x: 0.0
        y: 0.0
        z: 0.0
        w: 1.0
drone_odom_topic_name: "/airsim_node/drone_1/odom_local_ned" # 必须
reset_service_name: "/airsim_node/reset" # /airsim_node/reset 