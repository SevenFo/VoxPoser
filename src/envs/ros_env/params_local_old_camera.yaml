cameras: # 相机参数, 可以有多个相机 必须项
  - 
    name: "camera_drone_front" # 相机名称 必须项
    camera_base_link_frame_id: "camera_drone_front_base_link"
    rgb_topic_name: "/camera/color/image_raw" # rgb 图像话题名称 必须项
    depth_topic_name: "/camera/aligned_depth_to_color/image_raw"
    cloudpoint_topic_name: "/camera/depth_registered/points" # 点云 话题名称 必须项 #"/camera/aligned_depth_to_color/registered/points" 
    rgb_camera_info_topic_name: "/camera/color/camera_info" # rgb 相机信息话题名称 必须项
    depth_camera_info_topic_name: "/camera/aligned_depth_to_color/camera_info"
    rgb_frame_id: "camera_color_frame" # rgb 相机坐标系名称 必须项
    depth_frame_id: "camera_depth_frame" # 
    cloudpoint_frame_id: "camera_cloudpoint_frame"
